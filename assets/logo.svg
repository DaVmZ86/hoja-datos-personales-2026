<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hoja de Datos Personales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7fd0"/>
      <stop offset="1" stop-color="#123f74"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- hoja de datos -->
  <g transform="translate(132 84)">
    <rect x="22" y="22" width="226" height="314" rx="22" fill="#0a2a52" opacity=".5"/>
    <rect width="226" height="314" rx="22" fill="#ffffff"/>
    <!-- encabezado -->
    <rect x="30" y="30" width="166" height="12" rx="6" fill="#1d5fa6"/>
    <!-- foto / perfil -->
    <rect x="30" y="62" width="70" height="80" rx="12" fill="#e3ecf6"/>
    <circle cx="65" cy="91" r="15" fill="#1d5fa6"/>
    <path d="M40 136C40 118 52 110 65 110C78 110 90 118 90 136Z" fill="#1d5fa6"/>
    <!-- datos junto a la foto -->
