    <rect x="30" y="166" width="166" height="9" rx="4.5" fill="#c9d7e8"/>
    <rect x="30" y="190" width="140" height="9" rx="4.5" fill="#c9d7e8"/>
    <rect x="30" y="214" width="166" height="9" rx="4.5" fill="#c9d7e8"/>
    <rect x="30" y="238" width="110" height="9" rx="4.5" fill="#c9d7e8"/>
    <!-- línea de firma -->
    <line x1="56" y1="284" x2="170" y2="284" stroke="#1d5fa6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- sello de listo -->
  <circle cx="356" cy="368" r="70" fill="#3c9be8" stroke="#ffffff" stroke-width="12"/>
  <path d="M324 370 L347 393 L392 346" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
